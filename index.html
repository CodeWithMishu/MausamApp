<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MausamApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <ul id="navbar">
            <li>
                <div class="logo-element">
                    <img src="Assets/logo.svg" alt="Logo Image">
                    <span>MausamApp</span>
                </div>
                </li>
                <li>
                    <img src="Assets/theme-light.svg" alt="light theme icon">
                    <img src="Assets/menu-toggle.svg" alt="menu toggle icon">
                </li>
        </ul>
    </nav>

    <main>
<section class="hero">
<div class="hero-text"><span>Check the weather in your city</span>
    <span>Get real-time weather updates and forecast</span>
</div>
<div class="location-input">
    <div class="text-input">
        <img src="Assets/search.svg" alt="search icon">
        <input type="text" name="location" id="location">
    </div>
    <button id="search">Search</button>
</div>
</section>

<section id="current-wheather">
    <div class="location-info">
        <div>
            <span>Bharai</span>
            <img src="Assets/location.svg" alt="location icon">
        </div>
        <span>Friday, 8 August 2026</span>
        <span>10:30 AM</span>
    </div>
    <div class="weather-status">
        <span class="temperature">16.9°c</span>
        <span>Moderate Rain</span>
    </div>
    <div class="weather-detail">
        <div class="tempt">
            <span>Feels Like</span>
            <span>16.2°c</span>
        </div>
        <div class="humidity">
            <span>Humidity</span>
            <span>88%</span>
        </div>
        <div class="Wind">
            <span>Wind</span>
            <span>12 Km/h</span>
        </div>
        <div class="pressure">
            <span>Pressure</span>
            <span>1008 hPa</span>
        </div>
        <div class="visibility">
            <span>Visibility</span>
            <span>6.2 km</span>
        </div>
        <div class="uvindex">
            <span>UV Index</span>
            <span>2 Low</span>
        </div>
    </div>
</section>
    </main>
</body>
</html>
