<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MausamApp - Weather Forecast</title>
    <link rel="icon" type="image/svg+xml" href="Assets/logo.svg" />
  </head>
  <body>
    <nav id="navbar">
      <div class="logo-element">
        <img src="Assets/logo.svg" alt="MausamApp Logo" />
        <span>MausamApp</span>
      </div>
      <div class="nav-actions">
        <button id="theme-toggle-btn" aria-label="Toggle theme">
          <img id="theme-icon" src="Assets/theme-light.svg" alt="Toggle theme" />
        </button>
      </div>
    </nav>

    <main>
      <div id="feedback-container" class="feedback-container" aria-live="polite">
        <div id="loader" class="loader"></div>
        <p id="error-message" class="error-message"></p>
      </div>

      <section class="hero">
        <div class="hero-text">
          <span class="hero-title">Check the weather in your city</span>
          <span class="hero-subtitle">Get real-time weather updates and forecast</span>
        </div>
        <div class="location-input">
          <div class="text-input">
            <img src="Assets/search.svg" alt="search icon" />
            <input type="text" name="location" id="location" placeholder="Enter Your City..." autocomplete="off" />
          </div>
          <button id="search">Search</button>
          <button id="current-location-btn" title="Use my current location" aria-label="Use my current location">
            <img src="Assets/location.svg" alt="" />
          </button>
        </div>
      </section>

      <section id="current-weather" class="current-weather hidden">
        <div class="location-info">
          <div class="city-row">
            <img src="Assets/location.svg" alt="location icon" />
            <span id="city">--</span>
          </div>
          <span id="date" class="date-text">--</span>
        </div>
        <div class="weather-status">
          <img id="weather-icon" src="" alt="Weather Icon" />
          <span class="temperature">--°c</span>
          <span id="weather-description">--</span>
        </div>
        <div class="weather-detail">
          <div class="detail-item">
            <img src="Assets/weather-info/tempt.svg" alt="feels like icon" />
            <div>
              <span class="w-title">Feels Like</span>
              <span id="feels-like-value" class="w-value">--°c</span>
            </div>
          </div>
          <div class="detail-item">
            <img src="Assets/weather-info/humidity.svg" alt="humidity icon" />
            <div>
              <span class="w-title">Humidity</span>
              <span id="humidity-value" class="w-value">--%</span>
            </div>
          </div>
          <div class="detail-item">
            <img src="Assets/weather-info/wind.svg" alt="wind icon" />
            <div>
              <span class="w-title">Wind</span>
              <span id="wind-value" class="w-value">-- m/s</span>
            </div>
          </div>
        </div>
      </section>

      <section class="other-info hidden">
        <div class="forecast">
          <span class="section-title">5-Day Forecast</span>
          <div id="forecast-weekdays" class="weekdays"></div>
        </div>
        <div class="highlight">
          <span class="section-title">Today's Highlights</span>
          <div class="h-type">
            <div class="high">
              <span class="high-label">Sunrise</span>
              <span id="sunrise-time" class="high-value">--:--</span>
            </div>
            <div class="high">
              <span class="high-label">Sunset</span>
              <span id="sunset-time" class="high-value">--:--</span>
            </div>
            <div class="high">
              <span class="high-label">Pressure</span>
              <span id="pressure-value" class="high-value">---- hPa</span>
            </div>
            <div class="high">
              <span class="high-label">Visibility</span>
              <span id="visibility-value" class="high-value">--.-- km</span>
            </div>
          </div>
        </div>
      </section>

      <footer>
        <div class="footer-content">
          Stay safe! Don't Forget Your Umbrella
        </div>
      </footer>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
